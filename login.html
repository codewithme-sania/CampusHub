
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusHub - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="login-page">
        <div class="login-container">

            <div class="login-logo">
                Campus<span>Hub</span>
            </div>

            <h1>Welcome Back!</h1>

            <p class="login-description">
                Login to continue exploring campus opportunities.
            </p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="login-options">
                    <label>
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>

                    <a href="#" id="forgotPassword">Forgot Password?</a>
                </div>

                <button type="submit" class="login-submit" id="loginButton">
                    Login
                </button>
            </form>

            <p id="loginMessage" role="status" aria-live="polite"
               style="display:none; margin-top:15px; text-align:center;">
            </p>

            <div class="divider">
                <span>OR</span>
            </div>

            <p class="signup-text">
                Don't have an account?
                <a href="signup.html" id="signupLink">Create Account</a>
            </p>

            <a href="index.html" class="back-home">
                ← Back to CampusHub
            </a>

        </div>
    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const loginMessage = document.getElementById("loginMessage");

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const remember = document.getElementById("remember").checked;

            loginMessage.style.display = "none";
            loginMessage.textContent = "";

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {
                const response = await fetch(
                    "http://127.0.0.1:5000/api/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Login failed.");
                }

                // Store the logged-in user's details.
                const storage = remember ? localStorage : sessionStorage;
                storage.setItem("campusHubUser", JSON.stringify(data.user));

                loginMessage.textContent = "Login successful! Redirecting...";
                loginMessage.style.color = "green";
                loginMessage.style.display = "block";

                window.location.href = "dashboard.html";

            } catch (error) {
                loginMessage.textContent =
                    error.message === "Failed to fetch"
                        ? "Cannot connect to the server. Make sure Flask is running."
                        : error.message;

                loginMessage.style.color = "red";
                loginMessage.style.display = "block";

            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });

        document.getElementById("forgotPassword").addEventListener(
            "click",
            function(event) {
                event.preventDefault();
                alert("Password recovery is not available yet.");
            }
        );
    </script>
</body>
</html>
