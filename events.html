<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusHub - Events</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f5f7fb;
            color: #222;
        }


        nav {
            background: #1e293b;
            color: white;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        nav h2 {
            font-size: 24px;
        }


        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            transition: 0.2s;
        }


        nav a:hover {
            color: #38bdf8;
        }


        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }


        .header {
            text-align: center;
            margin-bottom: 25px;
        }


        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }


        .header p {
            color: #666;
        }


        .add-event-section {
            text-align: center;
            margin-bottom: 25px;
        }


        .add-event-btn {
            display: inline-block;
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }


        .add-event-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }


        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }


        .search-box input {
            width: 500px;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }


        .search-box input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }


        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }


        .filter-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 20px;
            background: #e2e8f0;
            cursor: pointer;
            transition: 0.2s;
        }


        .filter-btn:hover {
            background: #cbd5e1;
        }


        .filter-btn.active {
            background: #2563eb;
            color: white;
        }


        .events-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }


        .event-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);

            transition: 0.3s;
        }


        .event-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.12);
        }


        .event-card h3 {
            margin-bottom: 10px;
            color: #1e293b;
        }


        .category {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
            margin-bottom: 15px;
        }


        .event-card p {
            margin: 8px 0;
            color: #555;
            line-height: 1.5;
        }


        .event-card button {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }


        .event-card button:hover {
            background: #1d4ed8;
        }


        /* =========================================
           LOADING STATE
        ========================================= */

        .loading {
            text-align: center;

            font-size: 16px;

            color: #2563eb;

            padding: 60px 25px;

            grid-column: 1 / -1;

            background: white;

            border-radius: 14px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.05);
        }


        .loading-icon {
            width: 55px;
            height: 55px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #eff6ff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 25px;
        }


        /* =========================================
           PROFESSIONAL EMPTY STATE
        ========================================= */

        .no-events {
            text-align: center;

            padding: 60px 25px;

            color: #666;

            grid-column: 1 / -1;

            background: white;

            border-radius: 14px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.05);
        }


        .empty-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #eff6ff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;
        }


        .no-events h3 {
            color: #1f2937;

            font-size: 22px;

            margin-bottom: 10px;
        }


        .no-events p {
            color: #6b7280;

            font-size: 14px;

            line-height: 1.6;

            max-width: 500px;

            margin: 0 auto;
        }


        .view-all-btn {
            display: inline-block;

            margin-top: 20px;

            padding: 10px 18px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 7px;

            font-size: 14px;

            transition: 0.2s;
        }


        .view-all-btn:hover {
            background: #1d4ed8;
        }


        /* =========================================
           ERROR STATE
        ========================================= */

        .error {
            text-align: center;

            color: #991b1b;

            padding: 55px 25px;

            grid-column: 1 / -1;

            background: white;

            border: 1px solid #fecaca;

            border-radius: 14px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.05);
        }


        .error-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #fef2f2;

            color: #dc2626;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;

            font-weight: bold;
        }


        .error h3 {
            color: #991b1b;

            font-size: 22px;

            margin-bottom: 10px;
        }


        .error p {
            color: #6b7280;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 20px;
        }


        .retry-btn {
            padding: 10px 20px;

            border: none;

            border-radius: 7px;

            background: #2563eb;

            color: white;

            cursor: pointer;

            font-size: 14px;

            transition: 0.2s;
        }


        .retry-btn:hover {
            background: #1d4ed8;
        }


        @media (max-width: 600px) {

            nav {
                flex-direction: column;
                gap: 12px;
                padding: 18px 20px;
            }


            nav a {
                margin-left: 8px;
                margin-right: 8px;
            }


            .container {
                width: 92%;
            }


            .header h1 {
                font-size: 28px;
            }


            .search-box input {
                width: 100%;
            }


            .events-grid {
                grid-template-columns: 1fr;
            }


            .no-events,
            .error,
            .loading {
                padding: 40px 18px;
            }

        }

    </style>

</head>


<body>


    <!-- NAVIGATION -->

    <nav>

        <h2>CampusHub</h2>

        <div>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="opportunities.html">
                Opportunities
            </a>

            <a href="events.html">
                Events
            </a>

            <a href="saved.html">
                Saved
            </a>

            <a href="index.html">
                Home
            </a>

        </div>

    </nav>


    <div class="container">


        <!-- HEADER -->

        <div class="header">

            <h1>
                Discover Events
            </h1>

            <p>
                Find technical events, competitions,
                seminars and workshops.
            </p>

        </div>


        <!-- ADD EVENT -->

        <div class="add-event-section">

            <a
                href="add-event.html"
                class="add-event-btn"
            >
                + Add Event
            </a>

        </div>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="eventSearch"
                placeholder="Search events..."
                onkeyup="searchEvents()"
            >

        </div>


        <!-- FILTERS -->

        <div class="filters">

            <button
                class="filter-btn active"
                onclick="filterEvents('All', this)"
            >
                All
            </button>


            <button
                class="filter-btn"
                onclick="filterEvents('Technical', this)"
            >
                Technical
            </button>


            <button
                class="filter-btn"
                onclick="filterEvents('Competition', this)"
            >
                Competition
            </button>


            <button
                class="filter-btn"
                onclick="filterEvents('Seminar', this)"
            >
                Seminar
            </button>


            <button
                class="filter-btn"
                onclick="filterEvents('Workshop', this)"
            >
                Workshop
            </button>

        </div>


        <!-- EVENTS -->

        <div
            id="eventsContainer"
            class="events-grid"
        >

            <div class="loading">

                <div class="loading-icon">
                    📅
                </div>

                <p>
                    Loading events...
                </p>

            </div>

        </div>


    </div>


    <script>


        let allEvents = [];

        let currentCategory = "All";


        /* =====================================================
           LOAD EVENTS
        ===================================================== */

        async function loadEvents() {

            const container =
                document.getElementById(
                    "eventsContainer"
                );


            container.innerHTML = `

                <div class="loading">

                    <div class="loading-icon">
                        📅
                    </div>

                    <p>
                        Loading events...
                    </p>

                </div>

            `;


            try {

                const response =
                    await fetch(
                        "http://127.0.0.1:5000/api/events"
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Failed to load events."
                    );

                }


                allEvents =
                    data.events || [];


                displayEvents(allEvents);

            }


            catch (error) {

                console.error(error);


                container.innerHTML = `

                    <div class="error">

                        <div class="error-icon">
                            !
                        </div>

                        <h3>
                            Unable to load events
                        </h3>

                        <p>
                            We couldn't connect to the
                            CampusHub server right now.
                            Please make sure Flask is running
                            and try again.
                        </p>

                        <button
                            class="retry-btn"
                            onclick="loadEvents()"
                        >
                            Try Again
                        </button>

                    </div>

                `;

            }

        }


        /* =====================================================
           DISPLAY EVENTS
        ===================================================== */

        function displayEvents(events) {

            const container =
                document.getElementById(
                    "eventsContainer"
                );


            if (events.length === 0) {

                const hasFilters =
                    document
                        .getElementById("eventSearch")
                        .value
                        .trim() !== ""
                    ||
                    currentCategory !== "All";


                if (hasFilters) {

                    container.innerHTML = `

                        <div class="no-events">

                            <div class="empty-icon">
                                🔎
                            </div>

                            <h3>
                                No matching events
                            </h3>

                            <p>
                                We couldn't find any events
                                matching your search or selected
                                category. Try another keyword or filter.
                            </p>

                            <a
                                href="events.html"
                                class="view-all-btn"
                            >
                                View All Events
                            </a>

                        </div>

                    `;

                }

                else {

                    container.innerHTML = `

                        <div class="no-events">

                            <div class="empty-icon">
                                📅
                            </div>

                            <h3>
                                No events available
                            </h3>

                            <p>
                                There are currently no events
                                available on CampusHub.
                                Be the first to add one!
                            </p>

                            <a
                                href="add-event.html"
                                class="view-all-btn"
                            >
                                + Add an Event
                            </a>

                        </div>

                    `;

                }


                return;

            }


            container.innerHTML =
                events.map(
                    function(event) {

                        return `

                            <div class="event-card">

                                <span class="category">
                                    ${escapeHTML(
                                        event.category
                                    )}
                                </span>


                                <h3>
                                    ${escapeHTML(
                                        event.title
                                    )}
                                </h3>


                                <p>
                                    <strong>
                                        Description:
                                    </strong>

                                    ${escapeHTML(
                                        event.description
                                    )}
                                </p>


                                <p>
                                    📅
                                    <strong>
                                        Date:
                                    </strong>

                                    ${escapeHTML(
                                        event.date
                                    )}
                                </p>


                                <p>
                                    📍
                                    <strong>
                                        Location:
                                    </strong>

                                    ${escapeHTML(
                                        event.location
                                    )}
                                </p>


                                <p>
                                    👤
                                    <strong>
                                        Organizer:
                                    </strong>

                                    ${escapeHTML(
                                        event.organizer
                                    )}
                                </p>


                                ${
                                    event.registration_link
                                    ?
                                    `
                                        <button
                                            onclick="registerEvent('${escapeAttribute(
                                                event.registration_link
                                            )}')"
                                        >
                                            Register
                                        </button>
                                    `
                                    :
                                    ""
                                }

                            </div>

                        `;

                    }
                )
                .join("");

        }


        /* =====================================================
           FILTER EVENTS
        ===================================================== */

        function filterEvents(
            category,
            button
        ) {

            currentCategory =
                category;


            document
                .querySelectorAll(
                    ".filter-btn"
                )
                .forEach(
                    function(btn) {

                        btn.classList.remove(
                            "active"
                        );

                    }
                );


            button.classList.add(
                "active"
            );


            applyFilters();

        }


        /* =====================================================
           SEARCH EVENTS
        ===================================================== */

        function searchEvents() {

            applyFilters();

        }


        /* =====================================================
           APPLY FILTERS
        ===================================================== */

        function applyFilters() {

            const searchText =
                document
                    .getElementById(
                        "eventSearch"
                    )
                    .value
                    .toLowerCase()
                    .trim();


            const filteredEvents =
                allEvents.filter(
                    function(event) {

                        const matchesCategory =
                            currentCategory === "All" ||
                            String(event.category)
                                .toLowerCase() ===
                            currentCategory.toLowerCase();


                        const searchableText = (

                            String(event.title || "") +
                            " " +
                            String(event.description || "") +
                            " " +
                            String(event.location || "") +
                            " " +
                            String(event.organizer || "")

                        ).toLowerCase();


                        const matchesSearch =
                            searchableText.includes(
                                searchText
                            );


                        return (
                            matchesCategory &&
                            matchesSearch
                        );

                    }
                );


            displayEvents(
                filteredEvents
            );

        }


        /* =====================================================
           REGISTER
        ===================================================== */

        function registerEvent(link) {

            if (link) {

                window.open(
                    link,
                    "_blank"
                );

            }

        }


        /* =====================================================
           HTML SECURITY
        ===================================================== */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        function escapeAttribute(value) {

            return String(value)
                .replace(
                    /\\/g,
                    "\\\\"
                )
                .replace(
                    /'/g,
                    "\\'"
                );

        }


        /* =====================================================
           START
        ===================================================== */

        loadEvents();

    </script>


</body>

</html>
