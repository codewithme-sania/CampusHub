<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusHub - Add Event</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f5f7fb;
            color: #222;
            padding: 40px 20px;
        }


        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }


        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #1e293b;
        }


        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }


        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }


        input,
        textarea,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: white;
            color: #222;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        input:hover,
        textarea:hover,
        select:hover {
            border-color: #93c5fd;
        }


        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }


        input::placeholder,
        textarea::placeholder {
            color: #9ca3af;
        }


        textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.5;
        }


        select {
            cursor: pointer;
        }


        .create-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.1s ease,
                box-shadow 0.2s ease;
        }


        .create-btn:hover {
            background: #1d4ed8;
            box-shadow: 0 5px 14px rgba(37, 99, 235, 0.25);
        }


        .create-btn:active {
            transform: scale(0.98);
        }


        .create-btn:disabled {
            background: #93c5fd;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }


        #message {
            margin-top: 20px;
            padding: 13px 15px;

            border-radius: 8px;

            text-align: center;
            font-weight: bold;
            line-height: 1.4;

            display: none;
        }


        #message.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }


        #message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }


        .back {
            display: block;
            text-align: center;
            margin-top: 22px;

            text-decoration: none;
            color: #2563eb;
            font-weight: bold;

            transition: color 0.2s ease;
        }


        .back:hover {
            color: #1d4ed8;
        }


        @media (max-width: 600px) {

            body {
                padding: 20px 15px;
            }


            .container {
                padding: 25px 20px;
                border-radius: 12px;
            }


            h1 {
                font-size: 25px;
            }


            .subtitle {
                margin-bottom: 25px;
            }


            input,
            textarea,
            select {
                font-size: 16px;
            }


            .create-btn {
                padding: 15px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <h1>
            Add Event
        </h1>


        <p class="subtitle">
            Create a new CampusHub event
        </p>


        <form id="eventForm">


            <!-- EVENT TITLE -->

            <label for="title">
                Event Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Enter event title"
                required
            >


            <!-- CATEGORY -->

            <label for="category">
                Category
            </label>

            <select
                id="category"
                required
            >

                <option value="">
                    Select category
                </option>

                <option value="Technical">
                    Technical
                </option>

                <option value="Competition">
                    Competition
                </option>

                <option value="Seminar">
                    Seminar
                </option>

                <option value="Workshop">
                    Workshop
                </option>

            </select>


            <!-- DESCRIPTION -->

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                placeholder="Enter event description"
                required
            ></textarea>


            <!-- DATE -->

            <label for="date">
                Date
            </label>

            <input
                type="date"
                id="date"
                required
            >


            <!-- LOCATION -->

            <label for="location">
                Location
            </label>

            <input
                type="text"
                id="location"
                placeholder="Example: Bangalore / Online / Campus"
                required
            >


            <!-- ORGANIZER -->

            <label for="organizer">
                Organizer
            </label>

            <input
                type="text"
                id="organizer"
                placeholder="Enter organizer name"
                required
            >


            <!-- REGISTRATION LINK -->

            <label for="registration_link">
                Registration Link
            </label>

            <input
                type="url"
                id="registration_link"
                placeholder="https://example.com/register"
            >


            <!-- CREATE BUTTON -->

            <button
                type="submit"
                class="create-btn"
                id="createButton"
            >
                Create Event
            </button>


        </form>


        <div
            id="message"
            role="alert"
        ></div>


        <a
            href="events.html"
            class="back"
        >
            ← Back to Events
        </a>


    </div>


    <script>


        const eventForm =
            document.getElementById("eventForm");


        const message =
            document.getElementById("message");


        const createButton =
            document.getElementById("createButton");


        // ==================================================
        // CREATE EVENT
        // ==================================================

        eventForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const eventData = {

                    title:
                        document
                            .getElementById("title")
                            .value
                            .trim(),

                    category:
                        document
                            .getElementById("category")
                            .value,

                    description:
                        document
                            .getElementById("description")
                            .value
                            .trim(),

                    date:
                        document
                            .getElementById("date")
                            .value,

                    location:
                        document
                            .getElementById("location")
                            .value
                            .trim(),

                    organizer:
                        document
                            .getElementById("organizer")
                            .value
                            .trim(),

                    registration_link:
                        document
                            .getElementById("registration_link")
                            .value
                            .trim()

                };


                // Disable button while submitting

                createButton.disabled = true;

                createButton.textContent =
                    "Creating Event...";


                try {

                    const response =
                        await fetch(
                            "http://127.0.0.1:5000/api/events",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(eventData)
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        showMessage(
                            data.message ||
                            "Failed to create event.",
                            "error"
                        );


                        createButton.disabled =
                            false;

                        createButton.textContent =
                            "Create Event";

                        return;
                    }


                    // Success

                    showMessage(
                        "Event created successfully!",
                        "success"
                    );


                    eventForm.reset();


                    createButton.disabled =
                        false;

                    createButton.textContent =
                        "Create Event";


                } catch (error) {

                    console.error(error);


                    showMessage(
                        "Cannot connect to the server. Make sure Flask is running.",
                        "error"
                    );


                    createButton.disabled =
                        false;

                    createButton.textContent =
                        "Create Event";

                }

            }
        );


        // ==================================================
        // MESSAGE
        // ==================================================

        function showMessage(text, type) {

            message.textContent =
                text;


            message.className =
                type;


            message.style.display =
                "block";


            clearTimeout(
                message.hideTimer
            );


            message.hideTimer =
                setTimeout(
                    function() {

                        message.style.display =
                            "none";

                    },
                    3000
                );

        }


    </script>


</body>

</html>
